
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MaxPSI · Material imprimible</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f6f3ee;color:#173653;margin:0}
.toolbar{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;padding:16px;background:white}
button,a{font-weight:bold;padding:11px 16px;border-radius:9px;border:0;background:#173653;color:white;text-decoration:none;cursor:pointer}
a{background:#e6f2f5;color:#173653}
.note{text-align:center;font-size:13px;padding:10px}
.sheet{width:210mm;height:297mm;margin:18px auto;background:white;display:flex;align-items:center;justify-content:center;padding:8mm}
.sheet img{max-width:100%;max-height:281mm;width:auto;height:auto;object-fit:contain}
@page{size:A4 portrait;margin:0}
@media print{
html,body{margin:0;background:white}
.toolbar,.note{display:none!important}
.sheet{margin:0;width:210mm;height:297mm;padding:8mm}
}
</style>
</head>
<body>

<div class="toolbar">
<strong id="title">Material imprimible MaxPSI</strong>
<button onclick="window.print()">Imprimir / Guardar como PDF</button>
<a id="download" href="#" download>Descargar PNG</a>
</div>

<p class="note">Formato A4 vertical. Elegí «Guardar como PDF» o tu impresora.</p>

<div class="sheet">
<img id="image" alt="Material imprimible MaxPSI">
</div>

<script>
const id=Number(new URLSearchParams(location.search).get('id'));

if(!Number.isInteger(id)||id<1||id>10){
document.body.textContent='Actividad no encontrada.';
}else{
const n=String(id).padStart(2,'0');
const path=`assets/actividad-${n}.png`;

document.getElementById('image').src=path;

const a=document.getElementById('download');
a.href=path;
a.download=`MaxPSI-actividad-${n}.png`;

document.getElementById('title').textContent=`MaxPSI · Actividad ${id}`;
document.title=`MaxPSI · Actividad ${id} · Imprimir`;
}
</script>

</body>
</html>
